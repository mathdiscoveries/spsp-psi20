# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Two 37-Digit 20-Base Strong Pseudoprimes (psi_20 <= n1 < 2^121), Order Criteria, and Exact Sieve Laws"
  description: >-
    Unconditional Lean 4 + Mathlib formalization (zero sorry, zero
    native_decide, standard axioms only) establishing two explicit 37-digit
    Zhang K2 strong pseudoprimes n1 = 2481162833436289154832260656117034821
    (121 bits) and n2 = 5959902256870799858089729225626992341 (123 bits) to the
    first 20 prime bases (2 through 71, defined via Mathlib's Nat.nth
    Nat.Prime), giving the upper bound psi_20 <= n1 < 2^121 (OEIS A014233).
    All four prime factors are certified inside the Lean kernel via Pratt
    certificates backed by Mathlib's lucas_primality, and both witnesses are
    proved to fail the strong test at the 21st prime 73 while passing Fermat at
    73. The K2 Fermat and 2-adic order criteria formalize specializations
    of Gerhard Jaeschke's 1993 results. The companion manuscript also presents
    the exact strong-liar fraction (1 + 2*4^(-e))/6 and base-2 cap <= 3/16,
    the exact sieve count A(b) and 10,135,125-class wheel mod 401,120,980,260,
    the Jacobsthal character sum -(2/b) with exact b mod 8 cell counts, and
    the K_{a/b} Legendre obstruction. Lean covers 6 of the manuscript's 8
    main claims. The other 2 are external sieve computations.
    AI research agents built and directed by Tyler B. Hughes generated and
    checked the work. No human mathematician has yet refereed the proof.
    Companion manuscript and verification archive:
    https://mathdiscoveries.org/results/spsp-psi20.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11Y11", "11A51", "11N36"]

sources:
  - title: "Two 37-Digit 20-Base Strong Pseudoprimes: Kernel-Verified Certificates, Order Criteria, and Exact Sieve Laws"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/spsp-psi20"
    type: paper
    location: "Companion manuscript, verification archive, and prior-work search log at https://mathdiscoveries.org/results/spsp-psi20"
    relationship: other
    author_endorsement: participated
    note: >-
      Companion manuscript by Tyler B. Hughes for the results presented
      in this project and produced by AI research agents he built and
      directed. These are the 37-digit 20-base K2 strong pseudoprimes n1
      (121-bit) and n2 (123-bit) establishing psi_20 <= n1 < 2^121 (Theorem 1),
      the exact K2 strong-liar fraction (1 + 2*4^(-e))/6 and base-2 cap <= 3/16
      (Proposition 3), the exact odd-prime sieve admissible count A(b) and
      10,135,125-class first wheel mod 401,120,980,260 (Proposition 4), the
      Jacobsthal character sum -(2/b) and exact b mod 8 cell counts
      (Theorem 5), and the general K_{a/b} 2-adic Legendre obstruction
      (Proposition 6). The base-2 cap and the general-ratio obstruction
      use the earlier criteria credited to Jaeschke below.
  - title: "Every prime has a succinct certificate"
    authors:
      - "Vaughan R. Pratt"
    id: "https://doi.org/10.1137/0204018"
    type: paper
    location: "SIAM J. Comput. 4 (1975), no. 3, 214-220"
    relationship: background
    note: "Recursive primality certification via predecessor factorization and primitive-root witnesses used to certify p1, q1, p2, q2 in Lean."
  - title: "On strong pseudoprimes to several bases"
    authors:
      - "Gerhard Jaeschke"
    id: "https://doi.org/10.1090/S0025-5718-1993-1192971-8"
    type: paper
    location: "Math. Comp. 61 (1993), no. 204, 915-926, Propositions 1 and 4 and the remark on p. 919"
    relationship: formalizes
    note: >-
      The single-base, two-prime forward direction of Proposition 1 is
      formalized in SpspPsi20.semiprime_padicValNat_orderOf_eq_of_sprp.
      The K2 specialization in k2_sprp_iff_two_adic_order incorporates the
      Fermat condition using the K2 factor relation and yields the
      equivalent residue-level form. Theorem 2 also gives an Euler-criterion
      form of Proposition 4, which states the odd-base Fermat criterion.
      The base-2 Fermat restriction in the remark on p. 919 supplies
      the congruence condition used to derive the cap in Proposition 3.
  - title: "Efficiency and security of cryptosystems based on number theory"
    authors:
      - "Daniel Bleichenbacher"
    id: "https://doi.org/10.3929/ethz-a-001637864"
    location: "Ph.D. thesis, Diss. ETH No. 11404, ETH Zurich, 1996, Table 3.2"
    relationship: background
    note: "Earlier 41-digit (135-bit) composite passing the first 21 prime bases."
  - title: "Two kinds of strong pseudoprimes up to 10^36"
    authors:
      - "Zhenxiang Zhang"
    id: "https://doi.org/10.1090/S0025-5718-07-01977-1"
    type: paper
    location: "Math. Comp. 76 (2007), no. 260, 2095-2107"
    relationship: background
    note: "Studies K2 strong pseudoprimes up to 10^36, strong-liar shares, and Conjecture 3 (minimality psi_t = psi'_t for t >= 12, which remains open)."
  - title: "Strong pseudoprimes to twelve prime bases"
    authors:
      - "Jonathan P. Sorenson"
      - "Jonathan Webster"
    id: "https://doi.org/10.1090/mcom/3134"
    type: paper
    location: "Math. Comp. 86 (2017), no. 304, 985-1003"
    relationship: background
    note: "Establishes psi_12 > 2^64, certifying deterministic primality in the external sieve."

status:
  scope: >-
    Unconditionally proved inside Lean 4 + Mathlib with standard axioms only
    (100 verified declarations in SpspPsi20, zero sorry, zero native_decide):
    6 of 8 main claims in the companion manuscript (100% of all theoretical
    theorems and the full headline witness/bound theorem), namely Theorem 1
    (both 37-digit K2 witnesses n1 and n2, all 4 Pratt primality proofs, all 20
    prime-base strong tests via Nat.nth Nat.Prime, failure at base 73, Fermat
    pass at base 73, and psi_20 <= n1 < 2^121), Theorem 2 (K2 Fermat and 2-adic
    order/level criteria), Proposition 3 (strong-liar share (1 + 2*4^(-e))/6
    and base-2 cap <= 3/16), Proposition 4 (exact sieve count A(b) and
    10,135,125-class wheel mod 401,120,980,260), Theorem 5 (Jacobsthal sum
    -(2/b) and exact b mod 8 cell counts), and Proposition 6 (general K_{a/b}
    2-adic Legendre obstruction). The remaining 2 claims in the manuscript
    (Propositions 7 and 8: exhaustive external GMP C sieve over 1.53e18
    integers in (10^36, 10^37] and a 7-ratio C sweep over 1.49e10 candidates)
    are external computations not formalized in Lean, and Zhang's minimality
    conjecture (psi_20 = n1) remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

