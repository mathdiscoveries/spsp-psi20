  - title: "Finding strong pseudoprimes to several bases. II"
    authors:
      - "Zhenxiang Zhang"
      - "Min Tang"
    id: "https://doi.org/10.1090/S0025-5718-03-01545-X"
    type: paper
    location: "Math. Comp. 72 (2003), no. 244, 2085-2097, (1.5)-(1.6), p. 2087; Section 5, p. 2095; Table 6, p. 2096"
    relationship: independently-proves
    note: >-
      Read pp. 2085-2087 and 2095-2096 (an open copy of the journal PDF).
      With PR(n) = SB(n)/phi(n) (1.2), p. 2087 states "PR(n) = 1/4 <=>
      either n = pq is a K2-number with p = 3 mod 4 or n is a C3-number" (1.5)
      and "if n is an spsp(2), then PR(n) = 1/4 <=> n is a C3-number" (1.6).
      Section 5, p. 2095, derives both from Monier's count ("Using this
      formula, it is easy to prove (1.5) and (1.6)"), and Table 6, p. 2096,
      gives max PR(n) = 3/16 for K2 numbers under "the additional condition
      that n is an spsp(2)" (p. 2095). These are the quarter-share case and
      the base-2 cap of k2_strongLiar_share_and_base2_cap, which proves them
      again.
  - title: "Evaluation and comparison of two efficient probabilistic primality testing algorithms"
    authors:
      - "Louis Monier"
    id: "https://doi.org/10.1016/0304-3975(80)90007-9"
    type: paper
    location: "Theoretical Computer Science 12 (1980), no. 1, 97-108, Proposition 1 and p. 102 [to check]"
    relationship: independently-proves
    note: >-
      Not read [to check]: the publisher's page refused the request (HTTP
      403) and no open copy was reachable through the logged gate. Unread:
      the whole paper, including Proposition 1 and p. 102. The credit rests
      on two read sources that quote the result. Damgård, Landrock and
      Pomerance (1993), p. 180, (2.2): "In [5], Monier showed that S(n) =
      (1 + 1 + 2^omega(n) + ... + 2^((nu(n)-1)omega(n))) prod_(p|n) (p - 1, u)";
      Zhang and Tang (2003), p. 2095: "Monier [8] proved that SB(n) = (1 +
      (2^(k1 s) - 1)/(2^s - 1)) prod gcd(q, q_i)". For n = p(2p - 1) with
      v_2(p - 1) = e this count gives the share (1 + 2*4^(-e))/6 that
      k2_strongLiar_share_and_base2_cap proves. K. Conrad, "The Miller-Rabin
      test" (expository note), p. 4, read, reports "Monier [10, p. 102]
      showed that if p and 2p - 1 are prime and p = 3 mod 4 then the
      proportion of Miller-Rabin witnesses for p(2p - 1) tends to 75%".
  - title: "Average case error estimates for the strong probable prime test"
    authors:
      - "Ivan Damgård"
      - "Peter Landrock"
      - "Carl Pomerance"
    id: "https://doi.org/10.1090/S0025-5718-1993-1189518-9"
    type: paper
    location: "Math. Comp. 61 (1993), no. 203, 177-194, Theorem 4(i), p. 186, and its proof, p. 187"
    relationship: independently-proves
    note: >-
      Read pp. 180 and 186-187 (math.dartmouth.edu/~carlp/PDF/paper88.pdf).
      Theorem 4, p. 186, lists the numbers (m + 1)(2m + 1) with m + 1, 2m + 1
      odd primes as class (i), and the proof, p. 187, gives "Suppose m + 1,
      2m + 1 are prime and 2^nu || m. If n = (m + 1)(2m + 1), then (2.2)
      implies S(n) = (1 + (4^nu - 1)/3) 4^(-nu) m^2, so that alpha(n) = S(n)/
      phi(n) = (1 + (4^nu - 1)/3)/(2 * 4^nu)". With p = m + 1 and nu = e this
      is the share (1 + 2*4^(-e))/6 of k2_strongLiar_share_and_base2_cap,
      which proves it again; nu = 1 gives the quarter share.
  - title: "OEIS A329759: Odd composite numbers k for which the number of witnesses for strong pseudoprimality of k equals phi(k)/4"
    authors:
      - "Amiram Eldar"
    id: "https://oeis.org/A329759"
    type: other
    location: "OEIS A329759 (Eldar 2019; comments by J. Song 2026)"
    relationship: background
    note: >-
      Read. A329759 records the quarter-share sequence and describes the
      form of its semiprime terms: "The semiprime terms of this sequence are
      of the form (2*m+1)*(4*m+1) where 2*m+1 and 4*m+1 are primes and m is
      odd". The quarter-share clause of Proposition 3 is related.
  - title: "Strong pseudoprimes to twelve prime bases"
    authors:
      - "Jonathan P. Sorenson"
      - "Jonathan Webster"
    id: "https://doi.org/10.1090/mcom/3134"
    type: paper
    location: "Math. Comp. 86 (2017), no. 304, 985-1003; preprint arXiv:1509.00864v1, Section 2.3, Propositions 2.5 and 2.6, p. 5"
    relationship: independently-proves
    note: >-
      Read the arXiv v1 preprint, Sections 2.1-2.3. Propositions 2.5 and 2.6,
      p. 5, which "appeared originally in [Jaeschke]", state: "For primes p
      and q, if v(p - 1) = v(q - 1) and v(ord_p(a)) = v(ord_q(a)) then (a/p)
      = (a/q)" and "For primes p and q, if v(p - 1) < v(q - 1) and
      v(ord_p(a)) = v(ord_q(a)) then (a/q) = 1". With Theorem 2.2, p. 3
      (Jaeschke's Proposition 1), and b(q - 1) = a(p - 1), these give the
      three cases of k_gen_legendre_of_ratio, which proves them again. The
      paper also establishes psi_12 > 2^64, which certifies deterministic
      primality in the external sieve.
  - title: "Quadratic residue patterns modulo a prime"
    authors:
      - "Keith Conrad"
    id: "https://kconrad.math.uconn.edu/blurbs/ugradnumthy/QuadraticResiduePatterns.pdf"
    type: other
    location: "Expository note, University of Connecticut, Section 3, p. 5 (table of length-2 patterns)"
    relationship: independently-proves
    note: >-
      Read in full (8 pages). Section 3, p. 5: "The first work on counting
      quadratic residue patterns of two or more consecutive terms in F_p^x
      was by Aladov [1] in 1896. He counted each quadratic residue pattern of
      length 2 ... The counts of length 2 were computed explicitly as in the
      table below, depending on p mod 4", with N_p(1, 1), N_p(1, -1),
      N_p(-1, 1), N_p(-1, -1) equal to (p - 5)/4, (p - 1)/4, (p - 1)/4,
      (p - 1)/4 for p = 1 mod 4 and (p - 3)/4, (p + 1)/4, (p - 3)/4,
      (p - 3)/4 for p = 3 mod 4. Under t = 2x - 1 the cells (chi(x),
      chi(2x - 1)) of k2_jacobsthal_and_cells become these consecutive-pair
      cells with the signs twisted by chi(2), and the Jacobsthal sum -(2/b)
      is their signed total; the theorem proves them again. The original
      sources are not read [to check]: N. S. Aladov, Mat. Sb. 18 (1896),
      61-75 (in Russian), Conrad's reference [1]; and E. Jacobsthal's 1906
      dissertation, Chap. III, which Conrad says found exact formulas for
      patterns of length 2 and 3.
  - title: "Finite Fields"
    authors:
      - "Rudolf Lidl"
      - "Harald Niederreiter"
    id: "https://doi.org/10.1017/CBO9780511525926"
    type: book
    location: "Finite Fields, 2nd ed., Cambridge University Press, 1997, Theorem 5.48 [to check]"
    relationship: independently-proves
    note: >-
      Not read [to check]: no open copy. Unread: the whole book, including
      Theorem 5.48 and its page. Two prior-work census seats report that
      Theorem 5.48 gives sum_x eta(a2 x^2 + a1 x + a0) = -eta(a2) over F_q,
      q odd, when a2 != 0 and a1^2 - 4 a0 a2 != 0, from later papers quoting
      it. With (a2, a1, a0) = (2, -1, 0) this is the Jacobsthal sum
      sum_x chi(x) chi(2x - 1) = -(2/b) of k2_jacobsthal_and_cells, which
      proves it again.
  - title: "Rabin-Miller primality test: composite numbers which pass it"
    authors:
      - "François Arnault"
    id: "https://doi.org/10.1090/S0025-5718-1995-1260124-2"
    type: paper
    location: "Math. Comp. 64 (1995), no. 209, 355-361 [to check]"
    relationship: background
    note: >-
      Not read [to check]: ams.org refuses Claude agents by robots.txt.
      Unread: the whole paper. Two prior-work census seats report a 337-digit
      K2 number p(2p - 1) that is a strong pseudoprime to all 46 prime bases
      below 200 (pp. 360-361), a larger witness for psi_20 than n1, and a
      lemma that a K2 number is a Fermat pseudoprime to base b exactly when
      b is a square modulo 2p - 1 (Lemmas 3.1-3.2, p. 358).

status:
  scope: >-
    Unconditionally proved inside Lean 4 + Mathlib with standard axioms only
    (100 verified declarations in SpspPsi20, zero sorry, zero native_decide):
    6 of 8 main claims in the companion manuscript (75%), namely Theorem 1
    (both 37-digit K2 witnesses n1 and n2, all 4 Pratt primality proofs, all 20
    prime-base strong tests via Nat.nth Nat.Prime, failure at base 73, Fermat
    pass at base 73, and psi_20 <= n1 < 2^121), Theorem 2 (K2 Fermat and 2-adic
    order/level criteria), Proposition 3 (strong-liar share (1 + 2*4^(-e))/6
    and base-2 cap <= 3/16), Proposition 4 (exact sieve count A(b), the
    first-wheel modulus 401,120,980,260 and the product 10,135,125 of the ten
    local counts; the paper's written Chinese remainder theorem argument
    identifies that product with the number of simultaneous admissible
    classes), Theorem 5 (Jacobsthal sum
    -(2/b) and exact b mod 8 cell counts), and Proposition 6 (general K_{a/b}
    2-adic Legendre obstruction). The remaining 2 claims in the manuscript
    (Proposition 7: an exhaustive external GMP C sieve over the
    1,528,961,196,313,242,172 integers p with 10^36 < p(2p - 1) <= 10^37;
    Proposition 8: an external seven-ratio sweep for p > 173 and
    pq <= psi'_17, projected 1.493e10 candidates) are external computations
    not formalized in Lean. At t = 20, Zhang conjectured psi_20 = psi'_20.
    Combined with the reported external determination psi'_20 = n1, this
    would give psi_20 = n1. Lean proves psi_20 <= n1.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

