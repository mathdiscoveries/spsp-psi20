      form of Proposition 4, which states the odd-base Fermat criterion.
      The base-2 Fermat restriction in the remark on p. 919 supplies
      the congruence condition used to derive the cap in Proposition 3.
      Read pp. 917-919 and 924-925 (cr.yp.to/bib/1993/jaeschke.pdf).
      Proposition 3, p. 918 ("Delta(p - 1) = Delta(q - 1) and sigma_p^(a) =
