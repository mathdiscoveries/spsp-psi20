sources:
  - title: "Two 37-Digit 20-Base Strong Pseudoprimes: Kernel-Verified Certificates, Order Criteria, and Exact Sieve Laws"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/spsp-psi20"
    type: paper
    location: "https://mathdiscoveries.org/results/spsp-psi20"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package, and the Lean work formalizes them; the
      formalization presents no result that the paper does not. These are the
      37-digit 20-base K2 strong pseudoprimes n1 (121-bit) and n2 (123-bit)
      establishing psi_20 <= n1 < 2^121 (Theorem 1), the K2 order criteria
      (Theorem 2), the exact K2 strong-liar fraction (1 + 2*4^(-e))/6 and
      base-2 cap <= 3/16 (Proposition 3), the exact odd-prime sieve admissible
      count A(b) and its wheel (Proposition 4), the Jacobsthal character sum
      -(2/b) and exact b mod 8 cell counts (Theorem 5), and the general
      K_{a/b} 2-adic Legendre obstruction (Proposition 6). Theorem 2
      specializes criteria of Jaeschke (1993), listed below, and the base-2
      cap and the general-ratio obstruction use them. Propositions 7 and 8
      (external C sieve searches) are outside this package. AI research agents
      built and directed by Tyler B. Hughes generated and checked this work.
      No human mathematician has yet refereed the proof.
  - title: "Every prime has a succinct certificate"
    authors:
      - "Vaughan R. Pratt"
    id: "https://doi.org/10.1137/0204018"
    type: paper
    location: "SIAM J. Comput. 4 (1975), no. 3, 214-220"
    relationship: background
    note: "Recursive primality certification via predecessor factorization and primitive-root witnesses used to certify p1, q1, p2, q2 in Lean."
  - title: "On strong pseudoprimes to several bases"
    authors:
      - "Gerhard Jaeschke"
    id: "https://doi.org/10.1090/S0025-5718-1993-1192971-8"
    type: paper
    location: "Math. Comp. 61 (1993), no. 204, 915-926, Propositions 1 and 4 and the remark on p. 919"
    relationship: adapts
    note: >-
      The single-base, two-prime forward direction of Proposition 1 is
      formalized in SpspPsi20.semiprime_padicValNat_orderOf_eq_of_sprp.
      The K2 specialization in k2_sprp_iff_two_adic_order incorporates the
      Fermat condition using the K2 factor relation and yields the
      equivalent residue-level form. Theorem 2 also gives an Euler-criterion
      form of Proposition 4, which states the odd-base Fermat criterion.
      The base-2 Fermat restriction in the remark on p. 919 supplies
      the congruence condition used to derive the cap in Proposition 3.
  - title: "Efficiency and security of cryptosystems based on number theory"
    authors:
      - "Daniel Bleichenbacher"
    id: "https://doi.org/10.3929/ethz-a-001637864"
    type: other
    location: "Ph.D. thesis, Diss. ETH No. 11404, ETH Zurich, 1996, Table 3.2"
    relationship: background
    note: "Earlier 41-digit (135-bit) composite passing the first 21 prime bases."
  - title: "Two kinds of strong pseudoprimes up to 10^36"
    authors:
      - "Zhenxiang Zhang"
    id: "https://doi.org/10.1090/S0025-5718-07-01977-1"
    type: paper
    location: "Math. Comp. 76 (2007), no. 260, 2095-2107"
    relationship: independently-proves
    note: >-
      Studies K2 strong pseudoprimes up to 10^36 and their strong-liar
      shares, and states Conjecture 3 (psi_t = psi'_t for t >= 12). The
      companion paper's reference ledger records a full-text reading. Its
      equations (1.6)-(1.7), p. 2097, give the K2 quarter-share case that
      k2_strongLiar_share_and_base2_cap proves again (share 1/4 and failure
      at base 2 when p = 3 mod 4); that location is as the editorial audit
      seat reported it, not re-read in this round [to check], because
      ams.org refuses Claude agents by robots.txt. Zhang attributes the
      classification to Section 5 of Zhang and Tang (2003), next entry.
  - title: "Finding strong pseudoprimes to several bases. II"
    authors:
      - "Zhenxiang Zhang"
      - "Min Tang"
    id: "https://doi.org/10.1090/S0025-5718-03-01545-X"
    type: paper
    location: "Math. Comp. 72 (2003), no. 244, 2085-2097, Section 5"
    relationship: independently-proves
    note: >-
      Not read [to check]: ams.org refuses Claude agents by robots.txt and
      no other open copy was reachable. The credit, for the K2 quarter-share
      case of k2_strongLiar_share_and_base2_cap (p = 3 mod 4), rests only on
      the editorial audit seat's report that Zhang (2007) attributes that
      classification to Section 5 of this paper.
  - title: "Evaluation and comparison of two efficient probabilistic primality testing algorithms"
    authors:
      - "Louis Monier"
    id: "https://doi.org/10.1016/0304-3975(80)90007-9"
    type: paper
    location: "Theoretical Computer Science 12 (1980), no. 1, 97-108, Proposition 1"
    relationship: independently-proves
    note: >-
      Not read [to check]: the publisher's page refused the request (HTTP
      403) and no open copy was found. That Proposition 1 is the exact count
      of strong liars rests on the editorial audit seat's report. The count
      itself was read in OEIS A071294 (which links this paper), in R. J.
      Mathar's comment: "Let N = 2n+1 = Product_{i=1..s} p_i^r_i ...
      N-1=2^k*q and p_i-1 = 2^(k_i)*q_i ... Then a(n) = (1+Sum_{j=0..k1-1}
      2^(j*s)) * Product_{i=1..s} gcd(q,qi)." For n = p(2p - 1) with
      p - 1 = 2^e u, u odd, it gives u^2 (1 + (4^e - 1)/3) strong liars out
      of phi(n) = 2 * 4^e * u^2, which is the fraction (1 + 2*4^(-e))/6
      that k2_strongLiar_share_and_base2_cap proves for K2 numbers.
  - title: "OEIS A329759: Odd composite numbers k for which the number of witnesses for strong pseudoprimality of k equals phi(k)/4"
    authors:
      - "Amiram Eldar"
    id: "https://oeis.org/A329759"
    type: other
    location: "OEIS A329759 (Eldar 2019; comments by J. Song 2026)"
    relationship: independently-proves
    note: >-
      Read. It states: "The semiprime terms of this sequence are of the form
      (2*m+1)*(4*m+1) where 2*m+1 and 4*m+1 are primes and m is odd", that
      is, K2 numbers p(2p - 1) with p = 3 mod 4 have strong-liar share
      exactly 1/4, the case that k2_strongLiar_share_and_base2_cap proves
      again.
  - title: "Strong pseudoprimes to twelve prime bases"
    authors:
      - "Jonathan P. Sorenson"
      - "Jonathan Webster"
    id: "https://doi.org/10.1090/mcom/3134"
    type: paper
    location: "Math. Comp. 86 (2017), no. 304, 985-1003"
    relationship: background
    note: "Establishes psi_12 > 2^64, certifying deterministic primality in the external sieve."

status:
  scope: >-
    Unconditionally proved inside Lean 4 + Mathlib with standard axioms only
    (100 verified declarations in SpspPsi20, zero sorry, zero native_decide):
    6 of 8 main claims in the companion manuscript (75%), namely Theorem 1
    (both 37-digit K2 witnesses n1 and n2, all 4 Pratt primality proofs, all 20
    prime-base strong tests via Nat.nth Nat.Prime, failure at base 73, Fermat
    pass at base 73, and psi_20 <= n1 < 2^121), Theorem 2 (K2 Fermat and 2-adic
    order/level criteria), Proposition 3 (strong-liar share (1 + 2*4^(-e))/6
    and base-2 cap <= 3/16), Proposition 4 (exact sieve count A(b), the
    first-wheel modulus 401,120,980,260 and the product 10,135,125 of the ten
    local counts; the paper's written Chinese remainder theorem argument
    identifies that product with the number of simultaneous admissible
    classes), Theorem 5 (Jacobsthal sum
    -(2/b) and exact b mod 8 cell counts), and Proposition 6 (general K_{a/b}
    2-adic Legendre obstruction). The remaining 2 claims in the manuscript
    (Proposition 7: an exhaustive external GMP C sieve over the
    1,528,961,196,313,242,172 integers p with 10^36 < p(2p - 1) <= 10^37;
    Proposition 8: an external seven-ratio sweep for p > 173 and
    pq <= psi'_17, projected 1.493e10 candidates) are external computations
    not formalized in Lean. At t = 20, Zhang conjectured psi_20 = psi'_20.
    Combined with the reported external determination psi'_20 = n1, this
    would give psi_20 = n1. Lean proves psi_20 <= n1.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

