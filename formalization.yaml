      equal-valuation case of k_gen_legendre_of_ratio. Section 4, p. 925,
      sieves the form p(2p - 1) with Proposition 4 for b = 3, 5, 7, 11 and
      p = 1 mod 4, which "yield together 15 residue classes mod 4620"; the
      wheel count of Proposition 4 is the same count over b = 3, ..., 31.
