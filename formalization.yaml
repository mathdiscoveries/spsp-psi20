fidelity:
  divergences: >-
    The companion manuscript (Draft 4) contains 8 main claims plus 1 open
    conjecture (Zhang minimality psi_t = psi'_t for t >= 12). This Lean 4
    package proves 6 of those 8 claims (Theorems 1, 2 and 5 and Propositions
    3, 4 and 6, including the headline upper bound psi_20 <= n1 < 2^121).
    Proposition 7 of the manuscript reports an exhaustive external C-sieve
    enumeration over the 1,528,961,196,313,242,172 integers p with
    10^36 < p(2p - 1) <= 10^37 that returned exactly n1 and n2, and
    Proposition 8 an external seven-ratio sweep for p > 173 and
    pq <= psi'_17 (projected 1.493e10 candidates) that found none; those two external searches are not formalized in Lean and are omitted from
    Challenge.lean.

