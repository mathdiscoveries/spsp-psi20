fidelity:
  divergences: >-
    The companion manuscript (Draft 4) contains 8 main claims plus 1 open
    conjecture (Zhang minimality psi_t = psi'_t for t >= 12). This Lean 4
    package proves 6 of those 8 claims (all theoretical theorems and the full
    headline upper bound psi_20 <= n1 < 2^121). Propositions 7 and 8 of the
    manuscript report negative exhaustive C-sieve searches over 1.53e18
    integers in (10^36, 10^37] and 1.49e10 companion-ratio candidates; those
    two external searches are not formalized in Lean and are omitted from
    Challenge.lean.

