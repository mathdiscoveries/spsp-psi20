version: "v0.4"

project:
  name: "Two 37-Digit 20-Base Strong Pseudoprimes (psi_20 <= n1 < 2^121), Order Criteria, and Exact Sieve Laws"
  description: >-
    Unconditional Lean 4 + Mathlib formalization (zero sorry, zero
    native_decide, standard axioms only) establishing two explicit 37-digit
    Zhang K2 strong pseudoprimes n1 = 2481162833436289154832260656117034821
    (121 bits) and n2 = 5959902256870799858089729225626992341 (123 bits) to the
    first 20 prime bases (2 through 71, defined via Mathlib's Nat.nth
    Nat.Prime), giving the upper bound psi_20 <= n1 < 2^121 (OEIS A014233).
    All four prime factors are certified inside the Lean kernel via Pratt
    certificates backed by Mathlib's lucas_primality, and both witnesses are
    proved to fail the strong test at the 21st prime 73 while passing Fermat at
    73. The K2 Fermat and 2-adic order criteria adapt specializations
    of Gerhard Jaeschke's 1993 results. The companion manuscript also presents
    the exact strong-liar fraction (1 + 2*4^(-e))/6 and base-2 cap <= 3/16,
    the exact sieve count A(b), the first-wheel modulus 401,120,980,260 and the
    product 10,135,125 of the ten local counts (identified with the number of
    simultaneous admissible classes by the paper's written Chinese remainder
    theorem argument),
    the Jacobsthal character sum -(2/b) with exact b mod 8 cell counts, and
    the K_{a/b} Legendre obstruction. Coverage by this package's Palomar
    comparison: of the companion paper's 8 main results, 6 are compared in
    Lean in full (75%; Theorems 1, 2 and 5 and Propositions 3, 4 and 6);
    Propositions 7 and 8, external sieve computations, are by certificate
    only; Conjecture 9 is open and not counted. Abstract claims: 6 of 7
    compared in Lean (86%), 1 by certificate only.
    AI research agents built and directed by Tyler B. Hughes generated and
    checked the work. No human mathematician has yet refereed the proof.
    Companion manuscript and verification archive:
    https://mathdiscoveries.org/results/spsp-psi20.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

