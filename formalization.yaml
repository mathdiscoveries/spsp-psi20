alignment:
  namespace: "SpspPsi20Challenge"
  statements:
    - source: "Theorem 1: Two 37-digit K2 20-base strong pseudoprimes n1 (121b) and n2 (123b), base-73 failure + Fermat pass, and psi_20 <= n1 < 2^121"
      lean: "SpspPsi20Challenge.main_two_witnesses"
      module: "Challenge"
      status: proved
      note: "Unconditional pure-kernel proof with all 4 Pratt primality certificates and all 20 prime bases via Nat.nth Nat.Prime."
    - source: "Headline upper bound psi_20 <= 2481162833436289154832260656117034821"
      lean: "SpspPsi20Challenge.psi_20_le_n₁"
      module: "Challenge"
      status: proved
      note: "Direct standalone statement of the OEIS A014233 upper bound."
    - source: "Theorem 2: K2 Fermat Legendre criterion and Miller-Rabin 2-adic order/level criteria"
      lean: "SpspPsi20Challenge.k2_fermat_and_sprp_criteria"
      module: "Challenge"
      status: proved
      note: >-
        K2 forms of Jaeschke (1993), Propositions 1 and 4, including the
        equivalent residue-level criterion, for odd prime p with
        n = p(2p - 1) in K2 and gcd(b, n) = 1.
    - source: "Proposition 3: Exact K2 strong-liar fraction (1 + 2*4^(-e))/6 and base-2 cap <= 3/16"
      lean: "SpspPsi20Challenge.k2_strongLiar_share_and_base2_cap"
      module: "Challenge"
      status: proved
      note: "Includes p = 3 mod 4 base-2 exclusion and exact 3/16 equality at e = 2."
    - source: "Proposition 4: Exact odd-prime sieve admissible count A(b) and 10,135,125-class first wheel mod 401,120,980,260"
      lean: "SpspPsi20Challenge.sieve_admissible_and_wheel"
      module: "Challenge"
      status: proved
      note: "Proved over ZMod b for every odd prime b plus exact 10-prime wheel arithmetic."
    - source: "Theorem 5: Exact Jacobsthal sum -(2/b) and exact b mod 8 wheel cell counts 4 N_{-+} and 4 N_{++}"
      lean: "SpspPsi20Challenge.k2_jacobsthal_and_cells"
      module: "Challenge"
      status: proved
      note: "Exact quadratic character sum and cell identities for every odd prime b."
    - source: "Proposition 6: General K_{a/b} 2-adic Legendre obstruction"
      lean: "SpspPsi20Challenge.k_gen_legendre_of_ratio"
      module: "Challenge"
      status: proved
      note: "Direct ratio form b(q - 1) = a(p - 1) for odd primes p, q with gcd(a, b) = 1."
    - source: "Sanity witness: 21st prime (0-indexed 20) equals 73"
      lean: "SpspPsi20Challenge.nth_prime_20"
      module: "Challenge"
      status: proved
      note: "Confirms 0-indexed Nat.nth Nat.Prime convention covers 2..71 for k = 20 and fails at 73."
