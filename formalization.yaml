      Read pp. 2095-2098 (a copy obtained through university access). With
      P_R(n) = SB(n)/phi(n) (1.2), p. 2095, p. 2097 states, citing Zhang and
      Tang (2003, Section 5) for the proof: "(1.6) P_R(n) = 1/4 <=> either
